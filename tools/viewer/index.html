<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#fafafa" />
    <title>Issue Trees</title>
  </head>
  <body>
    <header>
      <a class="brand" href="./">issue trees</a>
      <div class="document">
        <span id="document-name">Seeds of Renaissance</span
        ><span id="save-state" role="status">Example · edit a copy</span>
      </div>
      <nav aria-label="Document controls">
        <button id="undo" title="Undo (⌘/Ctrl Z)" aria-label="Undo" disabled>
          <svg viewBox="0 0 20 20">
            <path d="M7 4 3 8l4 4M3 8h8a5 5 0 0 1 0 10" />
          </svg></button
        ><button
          id="redo"
          title="Redo (⌘/Ctrl Shift Z)"
          aria-label="Redo"
          disabled
        >
          <svg viewBox="0 0 20 20">
            <path d="m13 4 4 4-4 4m4-4H9a5 5 0 0 0 0 10" />
          </svg></button
        ><span class="separator"></span><button id="open">Open Markdown</button
        ><button id="paste-toggle">Paste</button
        ><button id="source-toggle">Markdown</button
        ><button
          id="download"
          title="Download a Markdown copy"
          aria-label="Download Markdown"
        >
          <svg viewBox="0 0 20 20">
            <path d="M10 2v11m-4-4 4 4 4-4M3 14v4h14v-4" />
          </svg></button
        ><button id="save" class="save" disabled>Save</button>
      </nav>
      <input type="file" id="file" accept=".md,.markdown,.txt" hidden />
    </header>
    <div id="notice" role="alert" hidden>
      <span></span
      ><button id="dismiss-notice" aria-label="Dismiss message">×</button>
    </div>
    <main>
      <div
        id="viewport"
        tabindex="0"
        aria-label="Issue tree map. Click a question to edit. Drag the canvas to pan."
      >
        <div id="world">
          <svg id="connections" aria-hidden="true"></svg>
          <div id="nodes"></div>
        </div>
      </div>
      <div id="outline" hidden></div>
      <div id="editor" hidden aria-label="Edit selected question in place">
        <form id="node-form">
          <textarea
            id="question"
            rows="1"
            required
            aria-label="Question"
            placeholder="Write a question…"
          ></textarea>
          <div id="answer-fields">
            <textarea
              id="answer"
              rows="1"
              aria-label="Answer"
              placeholder="+ Add an answer…"
            ></textarea>
          </div>
          <div class="inline-actions">
            <button
              type="submit"
              id="close-editor"
              title="Finish editing (Enter)"
            >
              Done
            </button>
            <button
              type="button"
              id="cancel-edit"
              title="Discard draft (Escape)"
            >
              Cancel
            </button>
            <span id="draft-state" class="sr-only"></span>
          </div>
        </form>
        <details class="structure">
          <summary>Branch actions</summary>
          <div class="branch-actions">
            <button id="add-child">+ Child</button
            ><button id="add-sibling">+ Sibling</button>
            <label for="parent">Move to branch</label
            ><select id="parent"></select>
            <div class="row">
              <button id="move-up">Move up</button
              ><button id="move-down">Move down</button
              ><button id="delete" class="danger">Delete</button>
            </div>
          </div>
        </details>
      </div>
      <section id="import" class="sheet" hidden>
        <div class="panel-heading">
          <h2>Paste Markdown</h2>
          <button id="cancel-import" aria-label="Close import">×</button>
        </div>
        <label for="markdown"
          >A list, or a project with an Issue tree section</label
        ><textarea
          id="markdown"
          rows="12"
          placeholder="- What are we trying to understand?&#10;  - What do we know? **✅ An answer.**"
        ></textarea
        ><button id="load-paste" class="apply">Open tree</button>
      </section>
      <section id="source-panel" class="sheet" hidden>
        <div class="panel-heading">
          <h2>Markdown to save</h2>
          <button id="close-source" aria-label="Close Markdown preview">
            ×
          </button>
        </div>
        <p>The full document, including unchanged project context.</p>
        <textarea
          id="source"
          readonly
          rows="15"
          aria-label="Markdown preview"
        ></textarea
        ><button id="copy-source">Copy Markdown</button>
      </section>
      <div class="bottom-bar">
        <div class="zoom-controls">
          <button id="zoom-out" aria-label="Zoom out">−</button
          ><output id="zoom">100%</output
          ><button id="zoom-in" aria-label="Zoom in">+</button
          ><button id="fit">Fit</button><button id="overview">Collapse</button
          ><button id="expand">Expand</button>
        </div>
        <span id="hint">Click to edit · Drag to pan · Scroll to zoom</span>
        <div class="view-switch">
          <button id="map-view" aria-pressed="true">Map</button
          ><button id="outline-view" aria-pressed="false">Outline</button>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
